<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSPaintify</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127912;</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="presenter">
  <div class="presenter-container">
    <header class="presenter-header">
      <h1>MSPaintify</h1>
    </header>

    <div class="qr-section">
      <div class="qr-pointer">
        <span class="qr-pointer-arrow">→</span>
        <span class="qr-pointer-text">Scan to get your selfie mspaintified</span>
      </div>
      <div class="qr-box">
        <div id="qrcode"></div>
        <p class="qr-label">MSPaintify yourself!</p>
      </div>
    </div>

    <div class="slideshow-section">
      <div class="slideshow-pair" id="slideshowPair">
        <div class="photo-frame before">
          <div class="label">BEFORE</div>
          <img id="beforeImg" src="" alt="Before">
        </div>
        <div class="photo-frame after">
          <div class="label">AFTER</div>
          <img id="afterImg" src="" alt="After">
        </div>
      </div>
      <div class="slideshow-empty" id="slideshowEmpty">
        <div class="empty-content">
          <div class="paint-icon"></div>
          <p>Waiting for the first brave soul...</p>
          <p class="sub">Scan the QR code to get started!</p>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p class="footer-line">
        Built with 🧡 100% on Cloudflare — (
        <a href="https://developers.cloudflare.com/workers/languages/python/" target="_blank" rel="noopener">Python Workers</a>,
        <a href="https://developers.cloudflare.com/r2/" target="_blank" rel="noopener">R2</a>,
        <a href="https://developers.cloudflare.com/workers/platform/storage-options/#workers-kv" target="_blank" rel="noopener">KV</a>,
        <a href="https://developers.cloudflare.com/workflows/python/" target="_blank" rel="noopener">Workflows</a>,
        <a href="https://developers.cloudflare.com/ai/models/openai/gpt-image-2/" target="_blank" rel="noopener">AI Gateway</a>
        )
      </p>
      <p class="footer-line">
        <a href="https://github.com/craigsdennis/mspaintify-python-workers" target="_blank" rel="noopener">👀 the code</a>
      </p>
    </footer>
  </div>

  <script src="/presenter.js"></script>
</body>
</html>

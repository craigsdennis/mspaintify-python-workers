<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Upload</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Photo Upload</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="upload">Upload File</button>
      <button class="tab-btn" data-tab="camera">Take Photo</button>
      <button class="tab-btn" data-tab="gallery">Gallery</button>
      <button class="tab-btn" data-tab="mspaintified">MSPaintified</button>
    </div>

    <div id="upload" class="tab-panel active">
      <div class="drop-zone" id="dropZone">
        <p>Drag & drop a photo here or click to browse</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </div>

    <div id="camera" class="tab-panel">
      <div class="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" hidden></canvas>
        <div class="camera-controls">
          <button id="startCamera">Start Camera</button>
          <button id="snapPhoto" hidden>Take Photo</button>
          <button id="retakePhoto" hidden>Retake</button>
          <button id="uploadCapture" hidden>Upload Photo</button>
        </div>
      </div>
    </div>

    <div id="gallery" class="tab-panel">
      <button id="refreshGallery" class="refresh-btn">Refresh</button>
      <div id="galleryGrid" class="gallery-grid"></div>
    </div>

    <div id="mspaintified" class="tab-panel">
      <button id="refreshMspaintified" class="refresh-btn">Refresh</button>
      <div id="mspaintifiedGrid" class="gallery-grid"></div>
    </div>

    <div id="result" class="result hidden">
      <h3>Upload Complete!</h3>
      <img id="preview" src="" alt="Preview">
      <p id="resultText"></p>
      <button id="copyUrl">Copy URL</button>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
